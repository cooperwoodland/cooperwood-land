<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Cooper Woodland</title>
  <script>
    const emojiPaths = [
      '/🫶',
      '/🫶️',
      '/%F0%9F%A8%B6',
      '/%F0%9F%A8%B6%EF%B8%8F',
      '/%F0%9F%AB%B6',
      '/%F0%9F%AB%B6%EF%B8%8F'
    ];

    const redirects = {
      '/🫶': '/',
      '/🫶️': '/',
      '/linkedin': 'https://linkedin.com/in/cooper-fortner-woodland/',
      '/insta': 'https://instagram.com/cooper.woodland/',
      '/📷': 'https://instagram.com/cooper.woodland/',
      '/📷️': 'https://instagram.com/cooper.woodland/',
      '/%f0%9f%93%b7': 'https://instagram.com/cooper.woodland/',
      '/%f0%9f%93%b7%ef%b8%8f': 'https://instagram.com/cooper.woodland/',
      '/bsky': 'https://bsky.app/profile/cooperwood.land',
      '/🦋': 'https://bsky.app/profile/cooperwood.land',
      '/🦋️': 'https://bsky.app/profile/cooperwood.land',
      '/%f0%9f%a6%8b': 'https://bsky.app/profile/cooperwood.land',
      '/%f0%9f%a6%8b%ef%b8%8f': 'https://bsky.app/profile/cooperwood.land',
      '/spotify': 'https://open.spotify.com/user/315cf747jkgz2i6mtwz2qwg3bv54',
      '/🎧': 'https://open.spotify.com/user/315cf747jkgz2i6mtwz2qwg3bv54',
      '/🎧️': 'https://open.spotify.com/user/315cf747jkgz2i6mtwz2qwg3bv54',
      '/%f0%9f%8e%a7': 'https://open.spotify.com/user/315cf747jkgz2i6mtwz2qwg3bv54',
      '/%f0%9f%8e%a7%ef%b8%8f': 'https://open.spotify.com/user/315cf747jkgz2i6mtwz2qwg3bv54'
    };

    const rawPath = window.location.pathname.replace(/\/+$/, '');
    const currentPath = decodeURIComponent(rawPath);
    const normalizedPath = currentPath.replace(/[\uFE0E\uFE0F]/g, '').toLowerCase();

    if (emojiPaths.includes(rawPath) || emojiPaths.includes(currentPath)) {
      window.location.replace('/');
    } else if (redirects[normalizedPath] || redirects[currentPath] || redirects[rawPath.toLowerCase()]) {
      window.location.replace(
        redirects[normalizedPath] || redirects[currentPath] || redirects[rawPath.toLowerCase()]
      );
    }
  </script>
